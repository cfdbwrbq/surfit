[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "surfit"
version = "3.1.1"
description = "Gridding and contouring engine: regular grids from scattered data under gridding rules"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-only" }
authors = [
    { name = "M. V. Dmitrievsky" },
    { name = "V. N. Kutrunov" },
]
dependencies = ["numpy>=1.20"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
# surfit.progress() draws a live progress bar from the engine's log messages.
progress = ["tqdm>=4.20"]

[project.urls]
Homepage = "http://surfit.sourceforge.net"

[tool.scikit-build]
minimum-version = "0.8"
cmake.source-dir = "src"
cmake.version = ">=3.10"
build-dir = "build/{wheel_tag}"

# CMake installs the whole package, so scikit-build-core must not look for a
# Python package in the source tree as well.
wheel.packages = []

[tool.scikit-build.cmake.define]
# The wheel carries the engine, the globe and freeflow modules, and their
# bindings: no Tcl module, no CLI, and every shared library installed inside the
# package.
SURFIT_PYTHON_WHEEL = "ON"
SURFIT_BUILD_TCL = "OFF"
