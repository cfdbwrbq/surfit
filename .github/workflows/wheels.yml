name: wheels

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - ".github/workflows/**"
      - "ci/build-manylinux.sh"

permissions:
  contents: read

jobs:
  manylinux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: build with the project manylinux image
        run: ci/build-manylinux.sh
        env:
          REPO: ${{ github.workspace }}

      - uses: actions/upload-artifact@v4
        with:
          name: surfit-manylinux
          path: dist/manylinux2014/*.whl
